<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PHARM NOTE</title>
  <meta name="description" content="약사를 위한 OTC 신제품 브리핑 및 일반의약품 검색">
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles/style.css?v=10">
</head>
<body>
  <main class="page">

    <!-- ① 상단 -->
    <header class="top">
      <a class="logo" href="index.html" aria-label="PHARM NOTE 홈">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 8H7a4 4 0 0 0 0 8h5z" fill="#e5484d"/>
            <path d="M12 8h5a4 4 0 0 1 0 8h-5z" fill="#ffffff"/>
            <rect x="3" y="8" width="18" height="8" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
            <path d="M12 8v8" stroke="#1a1a1a" stroke-width="1.6"/>
          </svg>
        </span>
        PHARM NOTE
      </a>
      <span class="today" id="today"></span>
    </header>

    <p class="welcome">안녕하세요!<br><em>오늘도 새로운 약</em>을 알아봐요.</p>

    <div class="home-grid">
      <div class="briefing-col">
        <!-- ② Weekly Briefing (가장 강조되는 카드) -->
        <section class="briefing-card" aria-labelledby="wb-label">
          <span class="eyebrow" id="wb-label"><span class="dot"></span>Weekly Briefing</span>
          <div id="briefing-body" style="display:flex;flex-direction:column;flex:1" aria-live="polite"></div>
        </section>

        <!-- Monthly Briefing (얇고 옅은 카드) -->
        <a class="monthly-card" id="monthly-card" href="pages/briefing.html">
          <span class="monthly-left">
            <span class="eyebrow small"><span class="dot"></span>Monthly Briefing</span>
            <span class="monthly-title" id="monthly-title">이번 달 신제품 요약</span>
          </span>
          <span class="monthly-count" id="monthly-count">–</span>
        </a>
      </div>

      <div>
        <!-- ③ 빠른 검색 -->
        <section class="section">
          <div class="section-head">
            <h2 class="section-title">빠른 검색</h2>
            <span class="section-sub">전체 일반의약품</span>
          </div>
          <form class="search-box" id="quick-search" role="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <label class="sr-only" for="q">제품명 또는 성분명</label>
            <input id="q" name="q" type="search" placeholder="제품명 또는 성분명" autocomplete="off">
            <button class="search-go" type="submit">검색</button>
          </form>
          <div class="search-hints">
            <a class="chip" href="pages/search.html?q=%EC%95%84%EC%84%B8%ED%8A%B8%EC%95%84%EB%AF%B8%EB%85%B8%ED%8E%9C">아세트아미노펜</a>
            <a class="chip" href="pages/search.html?q=%EC%9D%B4%EB%B6%80%ED%94%84%EB%A1%9C%ED%8E%9C">이부프로펜</a>
            <a class="chip" href="pages/search.html?q=%EB%A1%9C%ED%8E%98%EB%9D%BC%EB%AF%B8%EB%93%9C">로페라미드</a>
          </div>
        </section>

        <!-- ④ 나의 보관함 (바로가기) -->
        <section class="section">
          <div class="section-head">
            <h2 class="section-title">나의 보관함</h2>
          </div>
          <div class="shelf">
            <a class="shelf-item" href="pages/favorites.html#favorites">
              <span class="shelf-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>
              </span>
              <span>
                <span class="shelf-name">즐겨찾기</span><br>
                <span class="shelf-count" id="fav-count">–</span>
              </span>
            </a>
            <a class="shelf-item" href="pages/favorites.html#recent">
              <span class="shelf-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
              </span>
              <span>
                <span class="shelf-name">최근 본 제품</span><br>
                <span class="shelf-count" id="recent-count">–</span>
              </span>
            </a>
          </div>
        </section>
      </div>
    </div>

    <footer class="foot-info">
      데이터 업데이트: <span id="updated-at">확인 중…</span><br>
      공식 허가정보는 식품의약품안전처 자료를 기준으로 하며, AI 분석은 별도 영역에 표시됩니다.
    </footer>
  </main>

  <!-- ⑤ 하단 고정 탭 (메뉴 이동) -->
  <nav class="tabbar" aria-label="주요 메뉴">
    <div class="tabbar-inner">
      <a class="tab" href="index.html" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>홈
      </a>
      <a class="tab" href="pages/briefing.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 8.5h8M8 12h8M8 15.5h5"/></svg>브리핑
      </a>
      <a class="tab" href="pages/search.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>검색
      </a>
      <a class="tab" href="pages/favorites.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>즐겨찾기
      </a>
    </div>
  </nav>

  <script src="js/app.js?v=10"></script>
  <script src="js/home.js?v=10"></script>
</body>
</html>
