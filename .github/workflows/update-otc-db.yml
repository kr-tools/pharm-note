# 전체 일반의약품 데이터베이스 업데이트
# 실행 방법: 저장소 → Actions 탭 → 왼쪽 'OTC DB 업데이트' → Run workflow

name: OTC DB 업데이트

on:
  workflow_dispatch:
    inputs:
      force:
        description: "건수가 크게 줄어도 강제로 덮어쓰기 (평소에는 체크하지 마세요)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v5

      - name: Node.js 준비
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 식약처 데이터 수집 및 DB 생성
        run: node scripts/build-otc-db.mjs
        env:
          MFDS_API_KEY: ${{ secrets.MFDS_API_KEY }}
          FORCE: ${{ inputs.force && '1' || '0' }}

      - name: 변경된 데이터 저장(커밋)
        run: |
          git config user.name "pharm-note-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "OTC DB 업데이트 ($(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST)"
            git push
          fi
