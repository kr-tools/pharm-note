# 관리자 요청 반영
# 관리자 화면 → 버튼 → GitHub 이슈 제출 시 자동 실행됩니다.
# 실행될 때마다 '열려 있는 요청 이슈'를 오래된 순으로 모두 처리해요.
#   (요청을 연달아 보내 일부 실행이 취소돼도, 다음 실행에서 함께 처리됨)
# 혹시 남은 요청이 있을 때를 대비해 1시간마다 한 번 확인하고,
# Actions 탭에서 'Run workflow'로 직접 돌릴 수도 있어요.
# 저장소 주인(본인)이 만든 이슈만 처리하고, 다른 사람의 이슈는 무시합니다.

name: 관리자 승인 반영

on:
  issues:
    types: [opened]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event_name != 'issues' || (
        startsWith(github.event.issue.title, '[PHARM NOTE]') &&
        github.event.issue.user.login == github.repository_owner
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v5

      - name: Node.js 준비
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 열린 요청 모두 반영
        run: node scripts/process-requests.mjs apply
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

      - name: 변경된 데이터 저장(커밋)
        run: |
          git config user.name "pharm-note-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            NUMS=$(node -e "try{const r=require(require('os').tmpdir()+'/pharm-requests.json');console.log(r.map(x=>'#'+x.number).join(' '))}catch(e){}")
            git commit -m "관리자 요청 반영 ${NUMS}"
            git pull --rebase
            git push
          fi

      # 저장에 성공한 뒤에만 댓글을 남기고 이슈를 닫음 (저장 실패 시 다음 실행에서 다시 처리)
      - name: 결과를 이슈에 남기고 닫기
        run: node scripts/process-requests.mjs report
