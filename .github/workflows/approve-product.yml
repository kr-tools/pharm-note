# 관리자 승인 반영
# 관리자 화면 → '승인 요청' → GitHub 이슈 제출 시 자동 실행됩니다.
# 저장소 주인(본인)이 만든 이슈만 처리하고, 다른 사람의 이슈는 무시합니다.

name: 관리자 승인 반영

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  apply:
    # ① 제목 표시 확인 ② 작성자가 저장소 주인인지 확인
    if: >-
      startsWith(github.event.issue.title, '[PHARM NOTE]') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v5

      - name: Node.js 준비
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 요청 내용 반영
        id: apply
        continue-on-error: true
        run: node scripts/apply-decision.mjs
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          RESULT_FILE: ${{ runner.temp }}/result.md

      - name: 변경된 데이터 저장(커밋)
        if: steps.apply.outcome == 'success'
        run: |
          git config user.name "pharm-note-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "관리자 결정 반영 (#${{ github.event.issue.number }})"
            git pull --rebase
            git push
          fi

      - name: 결과를 이슈에 남기기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          RESULT="${{ runner.temp }}/result.md"
          [ -f "$RESULT" ] || echo "❌ 처리 결과를 만들지 못했어요. Actions 로그를 확인해 주세요." > "$RESULT"
          echo "" >> "$RESULT"
          echo "반영된 내용은 1~2분 뒤 사이트에 나타나요. (실행 기록: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> "$RESULT"
          gh issue comment "$NUM" --repo "${{ github.repository }}" --body-file "$RESULT"
          if [ "${{ steps.apply.outcome }}" = "success" ]; then
            gh issue close "$NUM" --repo "${{ github.repository }}"
          fi

      - name: 실패 표시
        if: steps.apply.outcome != 'success'
        run: |
          echo "요청이 반영되지 않았어요. 이슈에 남긴 이유를 확인하세요."
          exit 1
